<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Medical Store</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        /* Custom scrollbar behavior for modern design */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #0d9488; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-800 antialiased">

<!-- Top Header Navigation -->
<header class="sticky top-0 z-40 bg-white border-b border-slate-200 shadow-xs">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
        <div class="flex items-center space-x-2">
            <!-- Medical Cross Icon -->
            <div class="bg-teal-600 text-white p-2 rounded-lg">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
                </svg>
            </div>
            <div>
                <h1 class="text-xl font-bold text-slate-900 tracking-tight">Madhav</h1>
                <p class="text-xs text-teal-600 font-semibold uppercase tracking-wider">Medical Store</p>
            </div>
        </div>

        <!-- Search Input Box -->
        <div class="flex-1 max-w-md mx-8 hidden sm:block">
            <div class="relative">
                <input type="text" id="desktopSearch" oninput="handleSearch(this.value)" placeholder="Search medicines, devices..." class="w-full bg-slate-100 border-0 rounded-full px-5 py-2 text-sm focus:outline-hidden focus:ring-2 focus:ring-teal-500 transition">
            </div>
        </div>

        <!-- Floating Action Cart Trigger -->
        <button onclick="toggleCart(true)" class="relative bg-teal-50 hover:bg-teal-100 text-teal-700 p-3 rounded-full transition cursor-pointer">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
            </svg>
            <span id="cartCount" class="absolute -top-1 -right-1 bg-rose-500 text-white font-bold text-xs w-5 h-5 rounded-full flex items-center justify-center hidden">0</span>
        </button>
    </div>

    <!-- Mobile Search Input Box -->
    <div class="p-3 border-t border-slate-100 bg-white sm:hidden">
        <input type="text" id="mobileSearch" oninput="handleSearch(this.value)" placeholder="Search medicines, devices..." class="w-full bg-slate-100 border-0 rounded-lg px-4 py-2 text-sm focus:outline-hidden focus:ring-2 focus:ring-teal-500">
    </div>
</header>

<main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
    <!-- Categories Layout System (Generated Automatically via Javascript) -->
    <div class="mb-8">
        <h2 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-3">Browse Categories</h2>
        <div id="categoryTabs" class="flex flex-wrap gap-2">
            <button onclick="filterCategory('All')" id="tab-All" class="px-4 py-2 rounded-full text-sm font-medium transition cursor-pointer bg-teal-600 text-white shadow-sm">All Products</button>
        </div>
    </div>

    <!-- Dynamic Product Listing Storefront Grid -->
    <div id="productGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 sm:gap-6">
        <!-- Products get parsed here dynamically -->
    </div>
</main>

<!-- Slide-out Shopping Cart Drawer Sidepanel Overlay -->
<div id="cartDrawer" class="fixed inset-0 z-50 overflow-hidden hidden" role="dialog" aria-modal="true">
    <div class="absolute inset-0 overflow-hidden">
        <!-- Blurred Backdrop dismiss barrier -->
        <div onclick="toggleCart(false)" class="absolute inset-0 bg-slate-900/40 backdrop-blur-xs transition-opacity"></div>

        <div class="pointer-events-none fixed inset-y-0 right-0 flex max-w-full pl-10">
            <div class="pointer-events-auto w-screen max-w-md bg-white shadow-2xl flex flex-col h-full">
                <!-- Drawer Header -->
                <div class="px-6 py-5 border-b border-slate-100 flex items-center justify-between">
                    <h2 class="text-lg font-bold text-slate-900 flex items-center gap-2">
                        🛒 Shopping Cart
                    </h2>
                    <button onclick="toggleCart(false)" class="text-slate-400 hover:text-slate-500 p-1 cursor-pointer">
                        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>
                    </button>
                </div>

                <!-- Cart Selected Line Items List Container -->
                <div class="flex-1 overflow-y-auto px-6 py-4 space-y-4" id="cartItemsList">
                    <!-- Dynamic items hook -->
                </div>

                <!-- Checkout Customer Metadata Form Panel -->
                <div class="border-t border-slate-100 bg-slate-50 p-6 space-y-4 shadow-inner">
                    <h3 class="text-sm font-bold text-slate-700 uppercase tracking-wider">Delivery Logistics</h3>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1">Your Full Name *</label>
                        <input type="text" id="custName" required placeholder="John Doe" class="w-full bg-white border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-hidden focus:ring-2 focus:ring-teal-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1">Mobile Number *</label>
                        <input type="tel" id="custMobile" required inputmode="numeric" maxlength="10" pattern="[6-9][0-9]{9}" placeholder="10-digit mobile number" class="w-full bg-white border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-hidden focus:ring-2 focus:ring-teal-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1">Complete Delivery Address *</label>
                        <textarea id="custAddress" required rows="2" placeholder="House/Flat No, Street, Landmark, Pincode" class="w-full bg-white border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-hidden focus:ring-2 focus:ring-teal-500"></textarea>
                    </div>

                    <!-- Grand Running Summary Pricing Box -->
                    <div class="flex justify-between items-center pt-2 font-semibold text-slate-900">
                        <span class="text-base">Grand Total Amount:</span>
                        <span class="text-xl text-teal-600" id="cartGrandTotal">₹0</span>
                    </div>

                    <!-- WhatsApp Dispatch Interactive Trigger Button -->
                    <button onclick="submitOrderViaWhatsApp()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 px-4 rounded-xl shadow-md transition flex items-center justify-center gap-2 cursor-pointer text-base">
                        <!-- WhatsApp Vector Brand Icon -->
                        <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946C.06 5.348 5.397.01 12.008.01c3.202.001 6.212 1.246 8.477 3.514 2.266 2.268 3.507 5.28 3.505 8.484-.004 6.657-5.34 11.997-11.953 11.997-2.005-.001-3.973-.502-5.713-1.457L0 24zm6.59-4.846c1.6.95 3.488 1.449 5.412 1.451 5.428 0 9.85-4.417 9.854-9.842.002-2.628-1.022-5.1-2.885-6.964C17.16 1.936 14.697.915 12.01.915c-5.43 0-9.855 4.417-9.86 9.843-.002 1.983.518 3.921 1.508 5.661l-.971 3.549 3.638-.954zm10.974-5.06c-.266-.134-1.579-.78-1.823-.866-.243-.088-.422-.132-.599.134-.176.265-.681.866-.836 1.043-.154.177-.309.199-.575.065-.266-.134-1.121-.413-2.137-1.321-.79-.705-1.323-1.577-1.479-1.843-.155-.267-.017-.411.117-.544.12-.12.265-.31.399-.465.132-.154.177-.265.265-.443.089-.177.044-.332-.022-.465-.066-.133-.599-1.446-.821-1.977-.217-.521-.437-.449-.599-.457-.155-.007-.332-.008-.509-.008-.177 0-.465.066-.708.332-.243.265-.929.907-.929 2.21 0 1.302.947 2.56 1.08 2.737.133.177 1.86 2.84 4.505 3.975.63.27 1.12.43 1.503.551.632.201 1.208.173 1.662.105.508-.077 1.579-.645 1.801-1.258.222-.613.222-1.139.155-1.258-.066-.118-.244-.199-.51-.332z"/></svg>
                        Place Order via WhatsApp
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Core Business Application Engine Routing Script Logic -->
<script>
    // Global variables to anchor data structures
    let productsMaster = [];
    let filteredProducts = [];
    let cart = [];
    let currentSelectedCategory = 'All';
    let currentSearchQuery = '';

    // Run bootstrap fetch initialization on document ready pipeline
    window.addEventListener('DOMContentLoaded', () => {
        fetch('./products.json')
            .then(response => response.json())
            .then(data => {
                productsMaster = data;
                const savedStock = JSON.parse(localStorage.getItem('plusCareStock') || '{}');
                productsMaster.forEach(product => {
                    if (Object.prototype.hasOwnProperty.call(savedStock, product.id)) product.stock = Number(savedStock[product.id]);
                });
                filteredProducts = data;
                renderCategories();
                renderProducts();
            })
            .catch(error => {
                console.error("Critical error parsing configuration files:", error);
                document.getElementById('productGrid').innerHTML = `<p class="text-rose-600 col-span-full text-center py-8 font-medium">Failed to load product configurations. Please check products.json structure setup.</p>`;
            });
    });

    // Loop through item array and isolate distinct category keys dynamically
    function renderCategories() {
        const categories = ['All', ...new Set(productsMaster.map(item => item.category))];
        const container = document.getElementById('categoryTabs');
        container.innerHTML = ''; // wipe baseline DOM nodes

        categories.forEach(cat => {
            const btn = document.createElement('button');
            btn.id = `tab-${cat}`;
            btn.innerText = cat === 'All' ? 'All Products' : cat;
            btn.className = `px-4 py-1.5 rounded-full text-sm font-medium transition cursor-pointer ${
                currentSelectedCategory === cat
                    ? 'bg-teal-600 text-white shadow-xs'
                    : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50'
            }`;
            btn.onclick = () => filterCategory(cat);
            container.appendChild(btn);
        });
    }

    // Apply state changes to filter buttons and cascade modifications to listing grids
    function filterCategory(category) {
        currentSelectedCategory = category;
        renderCategories();
        applyFilters();
    }

    // Handle typing mechanics for searching values
    function handleSearch(query) {
        currentSearchQuery = query.toLowerCase().trim();
        // keep search sync across responsive elements
        document.getElementById('desktopSearch').value = query;
        document.getElementById('mobileSearch').value = query;
        applyFilters();
    }

    // Combine categories selector parameters and textual searching values concurrently
    function applyFilters() {
        filteredProducts = productsMaster.filter(prod => {
            const matchesCategory = (currentSelectedCategory === 'All' || prod.category === currentSelectedCategory);
            const matchesSearch = prod.name.toLowerCase().includes(currentSearchQuery);
            return matchesCategory && matchesSearch;
        });
        renderProducts();
    }

    // Paint storefront canvas interface cards
    function renderProducts() {
        const grid = document.getElementById('productGrid');
        grid.innerHTML = '';

        if (filteredProducts.length === 0) {
            grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400 font-medium">No medical items match your query.</div>`;
            return;
        }

        filteredProducts.forEach(prod => {
            const card = document.createElement('div');
            card.className = "bg-white border border-slate-200 rounded-xl overflow-hidden shadow-xs hover:shadow-md transition flex flex-col justify-between";
            card.innerHTML = `
                    <div>
                        <div class="w-full aspect-square bg-slate-100 flex items-center justify-center overflow-hidden">
                            <img src="${prod.image}" alt="${prod.name}" onerror="this.src='https://placehold.co/300?text=Medical+Item'" class="w-full h-full object-cover">
                        </div>
                        <div class="p-3 sm:p-4">
                            <span class="inline-block text-[10px] font-bold tracking-wider uppercase text-teal-600 bg-teal-50 px-2 py-0.5 rounded-sm mb-1">${prod.category}</span>
                            <h3 class="text-sm font-semibold text-slate-900 line-clamp-2 min-h-[40px]">${prod.name}</h3>
                        </div>
                    </div>
                    <div class="p-3 sm:p-4 pt-0">
                        <div class="flex items-center justify-between mt-2">
                            <div>
                                <span class="text-base font-bold text-slate-900">₹${prod.price}</span>
                                <div class="text-[10px] ${prod.stock > 0 ? 'text-slate-500' : 'text-rose-600'} font-medium mt-0.5">
                                    ${prod.stock > 0 ? `${prod.stock} in stock` : 'Out of stock'}
                                </div>
                            </div>
                            ${(() => {
                const cartItem = cart.find(item => item.id === prod.id);
                const qty = cartItem ? cartItem.quantity : 0;

                if (qty > 0) {
                    return `
                                        <div class="flex items-center gap-1 bg-teal-50 border border-teal-200 rounded-lg p-1">
                                            <button onclick="updateQuantity(${prod.id}, -1)"
                                                class="w-7 h-7 rounded-md bg-white hover:bg-rose-50 text-rose-600 font-bold flex items-center justify-center cursor-pointer"
                                                title="Remove one">−</button>
                                            <span class="min-w-[28px] text-center text-sm font-bold text-teal-700">${qty}</span>
                                            <button onclick="addToCart(${prod.id})"
                                                ${qty >= prod.stock ? 'disabled' : ''}
                                                class="w-7 h-7 rounded-md ${qty >= prod.stock ? 'bg-slate-200 text-slate-400 cursor-not-allowed' : 'bg-teal-600 hover:bg-teal-700 text-white cursor-pointer'} font-bold flex items-center justify-center"
                                                title="Add one">+</button>
                                        </div>
                                    `;
                }

                return `

                                `;
            })()}
                        </div>
                            <button onclick="addToCart(${prod.id})" ${prod.stock <= 0 ? 'disabled' : ''} class="${prod.stock > 0 ? 'bg-teal-600 hover:bg-teal-700' : 'bg-slate-300 cursor-not-allowed'} text-white text-xs font-bold py-1.5 px-3 rounded-lg transition cursor-pointer">${prod.stock > 0 ? 'Add' : 'Out of Stock'}</button>
                        </div>
                    </div>
                `;
            grid.appendChild(card);
        });
    }

    // Add one item to cart, respecting available stock.
    function addToCart(productId) {
        const product = productsMaster.find(p => p.id === productId);
        if (!product || product.stock <= 0) return alert("This product is out of stock.");
        const existingItem = cart.find(item => item.id === productId);
        const currentQty = existingItem ? existingItem.quantity : 0;
        if (currentQty >= product.stock) return alert(`Only ${product.stock} unit(s) of ${product.name} are available.`);
        if (existingItem) existingItem.quantity += 1;
        else cart.push({ ...product, quantity: 1 });
        updateCartUI();
        renderProducts();
    }

    function updateQuantity(productId, amount) {
        const item = cart.find(item => item.id === productId);
        if (!item) return;
        const product = productsMaster.find(p => p.id === productId);
        if (amount > 0 && item.quantity >= product.stock) return alert(`Only ${product.stock} unit(s) of ${product.name} are available.`);
        item.quantity += amount;
        if (item.quantity <= 0) cart = cart.filter(i => i.id !== productId);
        updateCartUI();
        renderProducts();
    }

    // Synchronize interface items and badge numeric calculations
    function updateCartUI() {
        const countBadge = document.getElementById('cartCount');
        const itemsList = document.getElementById('cartItemsList');
        const totalDisplay = document.getElementById('cartGrandTotal');

        const totalItems = cart.reduce((acc, curr) => acc + curr.quantity, 0);
        const totalPrice = cart.reduce((acc, curr) => acc + (curr.price * curr.quantity), 0);

        // Update badge layers
        if (totalItems > 0) {
            countBadge.innerText = totalItems;
            countBadge.classList.remove('hidden');
        } else {
            countBadge.classList.add('hidden');
        }

        totalDisplay.innerText = `₹${totalPrice}`;

        // Paint drawer items layer
        itemsList.innerHTML = '';
        if (cart.length === 0) {
            itemsList.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-48 text-slate-400">
                        <p class="text-sm font-medium">Your shopping cart is empty</p>
                    </div>
                `;
            return;
        }

        cart.forEach(item => {
            const lineItem = document.createElement('div');
            lineItem.className = "flex items-center gap-3 bg-slate-50 p-2 rounded-lg border border-slate-100";
            lineItem.innerHTML = `
                    <img src="${item.image}" alt="${item.name}" onerror="this.src='https://placehold.co/100?text=Item'" class="w-12 h-12 object-cover bg-white rounded-md border border-slate-200">
                    <div class="flex-1 min-w-0">
                        <h4 class="text-xs font-semibold text-slate-900 truncate">${item.name}</h4>
                        <p class="text-xs text-slate-500 font-medium">₹${item.price} x ${item.quantity}</p>
                    </div>
                    <div class="flex items-center gap-1.5 bg-white border border-slate-200 rounded-md p-1 shadow-2xs">
                        <button onclick="updateQuantity(${item.id}, -1)" class="w-5 h-5 rounded-sm hover:bg-slate-100 flex items-center justify-center font-bold text-slate-500 cursor-pointer text-xs">-</button>
                        <span class="text-xs font-bold w-4 text-center text-slate-800">${item.quantity}</span>
                        <button onclick="updateQuantity(${item.id}, 1)" class="w-5 h-5 rounded-sm hover:bg-slate-100 flex items-center justify-center font-bold text-slate-500 cursor-pointer text-xs">+</button>
                    </div>
                `;
            itemsList.appendChild(lineItem);
        });
    }

    // Toggle state for open and close animations on side draw panels
    function toggleCart(open) {
        const drawer = document.getElementById('cartDrawer');
        if (open) {
            drawer.classList.remove('hidden');
        } else {
            drawer.classList.add('hidden');
        }
    }

    // Validate customer details, deduct stock, and open the WhatsApp order.
    function submitOrderViaWhatsApp() {
        const name = document.getElementById('custName').value.trim();
        const mobile = document.getElementById('custMobile').value.trim();
        const address = document.getElementById('custAddress').value.trim();
        if (!name || !mobile || !address) return alert("Please complete Name, Mobile Number and Delivery Address.");
        if (!/^[6-9][0-9]{9}$/.test(mobile)) return alert("Please enter a valid 10-digit Indian mobile number.");
        if (cart.length === 0) return alert("Your cart is empty. Please add medical products to your order.");
        for (const item of cart) {
            const product = productsMaster.find(p => p.id === item.id);
            if (!product || item.quantity > product.stock) return alert(`Stock changed for ${item.name}. Please review your cart.`);
        }
        const whatsappNumber = "917877066228";
        let message = "🟢 *NEW MEDICAL ORDER REQUEST*\n=============================\n\n";
        message += "👤 *Customer Details:*\n";
        message += `• Name: ${name}\n• Mobile: ${mobile}\n• Address: ${address}\n\n`;
        message += "📦 *Order Contents:*\n";
        cart.forEach((item,index) => { message += `${index+1}. ${item.name}\n   Qty: ${item.quantity} × ₹${item.price} = *₹${item.price*item.quantity}*\n`; });
        const grandTotal = cart.reduce((acc,curr)=>acc+(curr.price*curr.quantity),0);
        message += `\n=============================\n💰 *Grand Total Amount:* *₹${grandTotal}*\n\nPlease check availability and confirm processing details! Thank you.`;
        cart.forEach(item => { productsMaster.find(p=>p.id===item.id).stock -= item.quantity; });
        localStorage.setItem('plusCareStock', JSON.stringify(productsMaster.reduce((a,p)=>(a[p.id]=p.stock,a),{})));
        window.open(`https://wa.me/${whatsappNumber}?text=${encodeURIComponent(message)}`,'_blank');
        cart=[]; updateCartUI(); renderProducts();
    }
</script>
</body>
</html>
